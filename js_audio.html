<script>
var AudioEngine = (function() {
  var ctx = null;
  var isMuted = false;

  function init() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
  }

  function play(type) {
    if (isMuted) return;
    init();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();

    var now = ctx.currentTime;
    if (type === 'tap') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(540, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'jump') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(720, now + 0.28);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    } else if (type === 'flatline') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 1.2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.4);
    } else if (type === 'keepout') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.setValueAtTime(90, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    } else if (type === 'badend') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.6);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.6);
    } else if (type === 'chime') {
      var notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now + i * 0.1);
        gain.gain.setValueAtTime(0.12, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.38);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.38);
      });
    } else if (type === 'preview') {
      var bassNotes = [110, 110, 146.83, 164.81];
      bassNotes.forEach(function(frequency, i) {
        var bass = ctx.createOscillator();
        var bassGain = ctx.createGain();
        bass.type = "sawtooth";
        bass.frequency.setValueAtTime(frequency, now + i * 0.2);
        bassGain.gain.setValueAtTime(0.18, now + i * 0.2);
        bassGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.35);
        bass.connect(bassGain);
        bassGain.connect(ctx.destination);
        bass.start(now + i * 0.2);
        bass.stop(now + i * 0.2 + 0.35);
      });
      [440, 523.25, 659.25, 880, 783.99, 1046.5].forEach(function(frequency, i) {
        var lead = ctx.createOscillator();
        var leadGain = ctx.createGain();
        lead.type = "square";
        lead.frequency.setValueAtTime(frequency, now + 0.8 + i * 0.12);
        leadGain.gain.setValueAtTime(0.14, now + 0.8 + i * 0.12);
        leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 + i * 0.12 + 0.25);
        lead.connect(leadGain);
        leadGain.connect(ctx.destination);
        lead.start(now + 0.8 + i * 0.12);
        lead.stop(now + 0.8 + i * 0.12 + 0.25);
      });
    } else if (type === 'scan') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(1280, now + 0.4);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }
  }

  function toggleMute() {
    isMuted = !isMuted;
    var icon = document.getElementById("audioIcon");
    if (icon) icon.textContent = isMuted ? "🔇" : "🔊";
    return isMuted;
  }

  // iOS / iPadOS Safari Web Audio 自動再生制限解除リスナー
  function setupUserGestureUnlock() {
    var unlock = function() {
      init();
      if (ctx && ctx.state === "suspended") {
        ctx.resume();
      }
      document.removeEventListener('touchstart', unlock, true);
      document.removeEventListener('touchend', unlock, true);
      document.removeEventListener('click', unlock, true);
    };
    document.addEventListener('touchstart', unlock, true);
    document.addEventListener('touchend', unlock, true);
    document.addEventListener('click', unlock, true);
  }
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupUserGestureUnlock);
    } else {
      setupUserGestureUnlock();
    }
  }

  return { init: init, play: play, toggleMute: toggleMute };
})();
</script>
