<script>
var UIController = (function() {
  var tipCooldownUntil = 0;
  var lastClickedTipTarget = null;

  function switchView(viewName) {
    var views = ["viewAuth", "viewNovel", "viewKeepOut", "viewBadEnd", "viewTrueEnd"];
    views.forEach(function(v) {
      var el = document.getElementById(v);
      if (el) el.classList.add("hidden");
    });

    var targetId = "viewNovel";
    if (viewName === "auth" || viewName === "start") targetId = "viewAuth";
    else if (viewName === "keepout") targetId = "viewKeepOut";
    else if (viewName === "badend") targetId = "viewBadEnd";
    else if (viewName === "trueend") targetId = "viewTrueEnd";

    var targetEl = document.getElementById(targetId);
    if (targetEl) targetEl.classList.remove("hidden");

    var isNovel = (viewName === "novel");
    var tabCont = document.getElementById("charTabContainer");
    if (tabCont) tabCont.classList.toggle("hidden", !isNovel);
    var btnChart = document.getElementById("btnChart");
    if (btnChart) btnChart.classList.toggle("hidden", !isNovel);
    var btnHome = document.getElementById("btnHome");
    if (btnHome) btnHome.classList.toggle("hidden", !isNovel);

    try {
      if (window.history && window.history.pushState) {
        window.history.pushState({ view: viewName }, "", "#" + viewName);
      }
    } catch (e) {
      // GAS iframe等でのSecurityError抑制
    }
  }

  function updateHeaderTabs() {
    var state = TimelineState.getState();
    var c = state.currentChar;

    var tabA = document.getElementById("tabCharA");
    var tabB = document.getElementById("tabCharB");
    var tabC = document.getElementById("tabCharC");

    var base = "char-tab px-2.5 py-1 rounded-lg font-bold transition-all flex items-center gap-1 ";
    if (tabA) tabA.className = base + (c === "A" ? "text-emerald-400 bg-neutral-800 border border-emerald-500" : "text-neutral-400 hover:bg-neutral-800");
    if (tabB) tabB.className = base + (c === "B" ? "text-sky-400 bg-neutral-800 border border-sky-500" : "text-neutral-400 hover:bg-neutral-800");
    if (tabC) tabC.className = base + (c === "C" ? "text-amber-400 bg-neutral-800 border border-amber-500" : "text-neutral-400 hover:bg-neutral-800");
  }

  function flashScreen() {
    var overlay = document.getElementById("vfxOverlay");
    if (!overlay) return;
    overlay.className = "absolute inset-0 pointer-events-none z-50 bg-red-600/40 transition-none";
    setTimeout(function() {
      overlay.className = "absolute inset-0 pointer-events-none z-50 bg-transparent transition-colors duration-300";
    }, 80);
  }

  function shakeScreen() {
    var novel = document.getElementById("viewNovel");
    if (novel) {
      novel.classList.add("shake-screen");
      setTimeout(function() { novel.classList.remove("shake-screen"); }, 380);
    }
  }

  function showToast(msg) {
    var toast = document.createElement("div");
    toast.className = "fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 bg-neutral-900/95 text-amber-300 text-xs sm:text-sm font-bold rounded-xl border border-amber-500/50 shadow-2xl z-50 flex items-center gap-2 para-in";
    toast.innerHTML = '<span>⚡</span><span>' + msg.replace(/\n/g, '<br>') + '</span>';
    document.body.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = "0";
      toast.style.transition = "opacity 0.3s";
      setTimeout(function() { toast.remove(); }, 300);
    }, 2800);
  }

  function openTip(term, clickedEl) {
    AudioEngine.play('tap');
    lastClickedTipTarget = clickedEl || null;
    var tip = (MASTER_DB.tips && MASTER_DB.tips[term]) || (typeof TIPS_MASTER !== "undefined" ? TIPS_MASTER[term] : null);
    if (!tip) return;

    // 既読・アンロック永続化
    var state = TimelineState.getState();
    if (!state.unlockedTips) state.unlockedTips = {};
    if (!state.unlockedTips[term]) {
      state.unlockedTips[term] = true;
      TimelineState.saveLocal();
      renderTimeBlockStatus();
    }

    var termEl = document.getElementById("tipTermTitle");
    if (termEl) termEl.textContent = tip.term;
    var lawTextEl = document.getElementById("tipLawText");
    if (lawTextEl) lawTextEl.textContent = tip.law;
    var badgeEl = document.getElementById("tipCategoryBadge");
    var isAugustSecret = (term === "オーガスト卿" && TimelineState.hasClearedTrueEnd());
    if (badgeEl) {
      var catName = isAugustSecret ? "🔴 赤字TIPS【極秘追想録】" :
                    tip.category === "freedom" ? "自由権" :
                    tip.category === "equality" ? "平等権" :
                    tip.category === "social" ? "社会権" : "重要判例・統治機構";
      badgeEl.textContent = catName;
      if (isAugustSecret) {
        badgeEl.className = "px-2 py-0.5 rounded text-[10px] font-bold border border-red-500 text-red-300 bg-red-950/80 shadow-[0_0_10px_rgba(239,68,68,0.5)]";
      } else {
        badgeEl.className = "px-2 py-0.5 rounded text-[10px] font-bold border border-sky-500/40 text-sky-300 bg-sky-950/40";
      }
    }
    var descEl = document.getElementById("tipDescription");
    if (descEl) {
      var parts = tip.desc.split("\n\n");
      descEl.innerHTML = parts.map(function(p) {
        var isAlert = p.indexOf("🔴") !== -1;
        var borderStyle = isAlert ? "border-red-500/60 bg-red-950/40 text-red-200" : "border-neutral-800/80 bg-neutral-950/70 text-neutral-200";
        return '<div class="p-3.5 rounded-xl border leading-relaxed text-xs sm:text-sm ' + borderStyle + '">' + p.replace(/\n/g, '<br>') + '</div>';
      }).join("");

      // ユーザー指示対応：1回クリア（ノーマルクリア等）で裏面史が開示され、真エンドへのモチベーションを高める！
      if (term === "オーガスト卿") {
        if (TimelineState.hasClearedOnce()) {
          var secretBox = document.createElement("div");
          secretBox.className = "p-3.5 rounded-xl border border-red-500/60 bg-red-950/40 text-red-200 leading-relaxed text-xs sm:text-sm mt-3 space-y-2";
          secretBox.innerHTML = '<div class="font-bold text-red-400 flex items-center gap-1.5"><span>🔴</span><span>クリア後特典・統治機構の裏面史</span></div>' +
            '<div>冷酷非道な独裁者の仮面の奥には、かつて平等を掲げ、三十年前の大破局の極限下で「全員を救おうとすれば全員が餓死する」という数理的絶望に直面した男の、身を切るような苦渋の選択が封印されていました。</div>' +
            (TimelineState.hasClearedTrueEnd() ?
              '<div class="text-xs text-amber-300 font-bold pt-1">★ 真エンディング達成により、オーガスト卿自身の手記（極秘追想録）が解放されました。</div>' :
              '<div class="text-xs text-amber-400 font-bold pt-1">🗝️【真エンディングへの手引き】：10:30の時間軸に眠る3つの古遺物をすべて回収して真エンディングを達成すると、彼自身が真実の慟哭を綴った【極秘追想録（外伝シナリオ）】へジャンプできます！</div>');
          descEl.appendChild(secretBox);
        }

        // 真エンドクリア済みの場合はJUMPボタンを追加
        if (TimelineState.hasClearedTrueEnd()) {
          var jumpBtn = document.createElement("button");
          jumpBtn.className = "w-full mt-3 p-3.5 btn-secret-jump btn-canaan-jump rounded-xl text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer shadow-2xl transition-all";
          jumpBtn.innerHTML = '<span class="text-base animate-pulse">🔴</span><span>【極秘追想録へJUMP】オーガスト卿の手記を読む ➔</span>';
          jumpBtn.onclick = function() {
            closeTip();
            closeTipsArchive();
            GameEngine.launchNode("SIDE_AUGUST");
          };
          descEl.appendChild(jumpBtn);
        }
      }
    }

    var modal = document.getElementById("modalTip");
    if (modal) modal.classList.remove("hidden");
  }

  function closeTip() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalTip");
    if (modal) modal.classList.add("hidden");
    tipCooldownUntil = Date.now() + 350; // 350msのタップ貫通ガード

    if (lastClickedTipTarget) {
      try {
        lastClickedTipTarget.classList.remove("tip-link-focused");
        void lastClickedTipTarget.offsetWidth; // リフロー強制でアニメーション再起動
        lastClickedTipTarget.classList.add("tip-link-focused");
      } catch (e) {}
      lastClickedTipTarget = null;
    }
  }

  function isTipCooldown() {
    return Date.now() < tipCooldownUntil;
  }

  function openTipsArchive() {
    AudioEngine.play('tap');
    renderTipsArchiveModal('all');
    var modal = document.getElementById("modalTipsArchive");
    if (modal) modal.classList.remove("hidden");
  }

  function closeTipsArchive() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalTipsArchive");
    if (modal) modal.classList.add("hidden");
  }

  function renderTipsArchiveModal(filterCategory, searchQuery) {
    var state = TimelineState.getState();
    var tipsDb = (typeof TIPS_MASTER !== "undefined") ? TIPS_MASTER : (MASTER_DB.tips || {});
    var allKeys = Object.keys(tipsDb);
    var unlockedKeys = Object.keys(state.unlockedTips || {});

    var unlockedCountEl = document.getElementById("archiveUnlockedCount");
    if (unlockedCountEl) unlockedCountEl.textContent = unlockedKeys.length;
    var totalCountEl = document.getElementById("archiveTotalCount");
    if (totalCountEl) totalCountEl.textContent = allKeys.length;

    // 全TIPS解明時：検定クイズ挑戦バナーの表示制御
    var quizBanner = document.getElementById("bannerTipsQuizChallenge");
    if (quizBanner) {
      if (unlockedKeys.length >= allKeys.length && allKeys.length > 0) {
        quizBanner.classList.remove("hidden");
        var btnStart = document.getElementById("btnStartTipsQuiz");
        if (btnStart) {
          btnStart.onclick = function() {
            closeTipsArchive();
            QuizController.startQuiz();
          };
        }
      } else {
        quizBanner.classList.add("hidden");
      }
    }

    var grid = document.getElementById("archiveCardsGrid");
    if (!grid) return;
    grid.innerHTML = "";

    var q = (searchQuery || "").toLowerCase();
    var filteredKeys = allKeys.filter(function(k) {
      if (filterCategory && filterCategory !== "all") {
        if (tipsDb[k].category !== filterCategory) return false;
      }
      if (q) {
        var matchTerm = (tipsDb[k].term || "").toLowerCase().indexOf(q) !== -1;
        var matchLaw = (tipsDb[k].law || "").toLowerCase().indexOf(q) !== -1;
        var matchDesc = (tipsDb[k].desc || "").toLowerCase().indexOf(q) !== -1;
        var matchKey = k.toLowerCase().indexOf(q) !== -1;
        if (!matchTerm && !matchLaw && !matchDesc && !matchKey) return false;
      }
      return true;
    });

    if (filteredKeys.length === 0) {
      var emptyEl = document.createElement("div");
      emptyEl.className = "col-span-full text-center py-12 text-neutral-400 font-hud text-xs space-y-1.5";
      emptyEl.innerHTML = '<div class="text-2xl">🔍</div><div>「' + (searchQuery || "") + '」に一致する憲法条文・判例は見つかりませんでした。</div>';
      grid.appendChild(emptyEl);
      return;
    }

    filteredKeys.forEach(function(k) {
      var tip = tipsDb[k];
      var isUnlocked = (unlockedKeys.indexOf(k) !== -1);
      var isAugustCanaan = (k === "オーガスト卿" && TimelineState.hasClearedTrueEnd());

      var card = document.createElement("div");
      card.className = "archive-card p-3.5 sm:p-4 rounded-2xl flex flex-col justify-between cursor-pointer " +
                       (isAugustCanaan ? "border border-red-500/80 bg-red-950/30 shadow-[0_0_15px_rgba(239,68,68,0.25)]" : (isUnlocked ? "unlocked" : "locked"));

      var catName = isAugustCanaan ? "🔴 赤字TIPS【追想録】" :
                    tip.category === "freedom" ? "自由権" :
                    tip.category === "equality" ? "平等権" :
                    tip.category === "social" ? "社会権" : "重要判例";
      var catBadgeColor = isAugustCanaan ? "text-red-400 border-red-700 bg-red-950/80 shadow-sm" :
                          tip.category === "freedom" ? "text-emerald-400 border-emerald-800 bg-emerald-950/60" :
                          tip.category === "equality" ? "text-sky-400 border-sky-800 bg-sky-950/60" :
                          tip.category === "social" ? "text-amber-400 border-amber-800 bg-amber-950/60" :
                          "text-purple-400 border-purple-800 bg-purple-950/60";

      if (isUnlocked || isAugustCanaan) {
        card.innerHTML = '<div>' +
          '<div class="flex items-center justify-between gap-1 mb-1.5">' +
            '<span class="text-[9px] font-mono px-2 py-0.5 rounded border ' + catBadgeColor + '">' + catName + '</span>' +
            '<span class="text-[10px] ' + (isAugustCanaan ? "text-red-400 font-bold" : "text-emerald-400 font-mono") + '">' + (isAugustCanaan ? "★ 外伝解禁" : "✓ 解明済") + '</span>' +
          '</div>' +
          '<h4 class="text-xs sm:text-sm font-black ' + (isAugustCanaan ? "text-red-200" : "text-neutral-100") + ' font-hud line-clamp-1">' + tip.term + '</h4>' +
          '<div class="text-[10px] ' + (isAugustCanaan ? "text-red-400" : "text-sky-400") + ' font-mono mt-0.5 line-clamp-1">' + tip.law + '</div>' +
          '<p class="text-[11px] text-neutral-400 mt-2 line-clamp-2 leading-relaxed">' + (tip.desc.split("\n\n")[0] || "") + '</p>' +
          '</div>' +
          '<div class="mt-3 pt-2 border-t ' + (isAugustCanaan ? "border-red-900/60" : "border-neutral-800/80") + ' text-right">' +
            '<span class="text-[10px] ' + (isAugustCanaan ? "text-red-400 font-bold hover:underline" : "text-sky-400 font-bold hover:underline") + '">' + (isAugustCanaan ? "外伝手記を読む ▶" : "条文と判例を読む ▶") + '</span>' +
          '</div>';
        card.onclick = function() {
          openTip(k);
        };
      } else {
        card.innerHTML = '<div>' +
          '<div class="flex items-center justify-between gap-1 mb-1.5">' +
            '<span class="text-[9px] font-mono px-2 py-0.5 rounded border ' + catBadgeColor + '">' + catName + '</span>' +
            '<span class="text-[10px] text-neutral-500 font-mono">🔒 未解明</span>' +
          '</div>' +
          '<h4 class="text-xs sm:text-sm font-bold text-neutral-400 font-hud line-clamp-1">' + tip.term + '</h4>' +
          '<div class="text-[10px] text-neutral-500 font-mono mt-0.5 line-clamp-1">' + tip.law + '</div>' +
          '<p class="text-[11px] text-neutral-500 mt-2 line-clamp-2 leading-relaxed">ストーリー内で青く光るTIPSアンカーを調査すると、憲法条文と判例の知恵が永久保存されます。</p>' +
          '</div>' +
          '<div class="mt-3 pt-2 border-t border-neutral-800/40 text-right">' +
            '<span class="text-[10px] text-neutral-500 font-mono">シナリオを探索せよ</span>' +
          '</div>';
      }

      grid.appendChild(card);
    });
  }

  function openBadEndArchive() {
    AudioEngine.play('tap');
    renderBadEndArchiveModal('all');
    var modal = document.getElementById("modalBadEndArchive");
    if (modal) modal.classList.remove("hidden");
  }

  function closeBadEndArchive() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalBadEndArchive");
    if (modal) modal.classList.add("hidden");
  }

  function renderBadEndArchiveModal(filterCategory, searchQuery) {
    var state = TimelineState.getState();
    var nodes = (typeof MASTER_DB !== "undefined" && MASTER_DB.nodes) ? MASTER_DB.nodes : {};

    var badEndKeys = [];
    for (var i = 1; i <= 23; i++) {
      badEndKeys.push("BAD_" + (i < 10 ? "0" + i : i));
    }

    var unlockedBadEnds = Object.keys(state.unlockedEndings || {}).filter(function(k) {
      return k.indexOf("BAD_") === 0 && state.unlockedEndings[k];
    });

    var countEl = document.getElementById("badEndArchiveUnlockedCount");
    if (countEl) countEl.textContent = unlockedBadEnds.length;
    var headerCountEl = document.getElementById("headerBadEndCount");
    if (headerCountEl) headerCountEl.textContent = unlockedBadEnds.length;
    var bannerCountEl = document.getElementById("bannerBadEndCount");
    if (bannerCountEl) bannerCountEl.textContent = unlockedBadEnds.length;

    var grid = document.getElementById("badEndCardsGrid");
    if (!grid) return;
    grid.innerHTML = "";

    var q = (searchQuery || "").toLowerCase();
    var filteredKeys = badEndKeys.filter(function(k) {
      var n = nodes[k];
      if (!n) return false;

      if (filterCategory && filterCategory !== "all") {
        if (filterCategory === "A" && ["BAD_02", "BAD_05", "BAD_11", "BAD_12", "BAD_14", "BAD_17", "BAD_19"].indexOf(k) === -1) return false;
        if (filterCategory === "B" && ["BAD_04", "BAD_10", "BAD_15", "BAD_18"].indexOf(k) === -1) return false;
        if (filterCategory === "C" && ["BAD_01", "BAD_03", "BAD_13", "BAD_16"].indexOf(k) === -1) return false;
        if (filterCategory === "ALL" && ["BAD_06", "BAD_07", "BAD_08", "BAD_09", "BAD_20", "BAD_21", "BAD_22", "BAD_23"].indexOf(k) === -1) return false;
      }

      if (q) {
        var matchTitle = (n.title || "").toLowerCase().indexOf(q) !== -1;
        var matchDesc = (n.desc || "").toLowerCase().indexOf(q) !== -1;
        var matchHint = (n.hint || "").toLowerCase().indexOf(q) !== -1;
        var matchNo = (n.badNumber || "").toLowerCase().indexOf(q) !== -1;
        var matchKey = k.toLowerCase().indexOf(q) !== -1;
        if (!matchTitle && !matchDesc && !matchHint && !matchNo && !matchKey) return false;
      }
      return true;
    });

    if (filteredKeys.length === 0) {
      var emptyEl = document.createElement("div");
      emptyEl.className = "col-span-full text-center py-12 text-neutral-400 font-hud text-xs space-y-1.5";
      emptyEl.innerHTML = '<div class="text-2xl">💀</div><div>「' + (searchQuery || "") + '」に一致する結末は見つかりませんでした。</div>';
      grid.appendChild(emptyEl);
      return;
    }
    // 全BAD END（23件）解明時、またはシン読了時に特別カードを表示
    var isShinUnlocked = (unlockedBadEnds.length >= 23 || state.visitedNodes.indexOf("SHIN_01_MEMORY") !== -1);
    var isShinCompleted = (state.visitedNodes.indexOf("SHIN_06_PROLOGUE_LOOP") !== -1);

    if (isShinUnlocked && (!filterCategory || filterCategory === "all") && !q) {
      var shinCard = document.createElement("div");
      shinCard.className = "archive-card p-3.5 sm:p-4 rounded-2xl flex flex-col justify-between transition-all border-2 border-amber-500/80 bg-gradient-to-br from-amber-950/50 via-neutral-900 to-neutral-950 shadow-[0_0_20px_rgba(245,158,11,0.25)] col-span-full sm:col-span-2";
      shinCard.innerHTML = '<div>' +
        '<div class="flex items-center justify-between gap-1 mb-1.5">' +
          '<span class="text-[9px] font-mono px-2 py-0.5 rounded border text-amber-300 border-amber-600 bg-amber-950/90 font-bold">🕊️ 奇跡解禁【全BAD END踏破特典】</span>' +
          '<span class="text-[10px] text-amber-400 font-mono font-bold">' + (isShinCompleted ? '✓ 読了済' : '★ 未読了') + '</span>' +
        '</div>' +
        '<h4 class="text-sm sm:text-base font-black text-amber-200 font-hud">外伝：雨の日の約束 〜シンの見た青空〜</h4>' +
        '<p class="text-[11px] text-neutral-300 mt-2 leading-relaxed">1年前の酸性雨の夜、親友レンを生かすために自ら犠牲となった少年シン。23通りの絶望を踏破した者だけに明かされる、すべての始まりの真実。</p>' +
        '</div>' +
        '<div class="mt-3 pt-2.5 border-t border-amber-900/60 flex justify-between items-center">' +
          '<span class="text-[10px] text-amber-500/80 font-mono font-bold">EPISODE: SHIN</span>' +
          '<button class="btn-play-shin px-3 py-1.5 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-neutral-950 text-xs font-black rounded-lg shadow-lg transition-all active:scale-95 cursor-pointer font-hud">特別エピソードを開始する ➔</button>' +
        '</div>';
      var btnShin = shinCard.querySelector(".btn-play-shin");
      if (btnShin) {
        btnShin.onclick = function(e) {
          e.stopPropagation();
          AudioEngine.play('jump');
          closeBadEndArchive();
          GameEngine.launchNode("SHIN_01_MEMORY");
        };
      }
      grid.appendChild(shinCard);
    }

    filteredKeys.forEach(function(k) {
      var n = nodes[k];
      var isUnlocked = (unlockedBadEnds.indexOf(k) !== -1);

      var card = document.createElement("div");
      card.className = "archive-card p-3.5 sm:p-4 rounded-2xl flex flex-col justify-between transition-all " +
                       (isUnlocked ? "border border-rose-500/50 bg-rose-950/20 hover:border-rose-400" : "border border-neutral-800 bg-neutral-950/40 opacity-70");

      var catBadge = "";
      if (["BAD_02", "BAD_05", "BAD_11", "BAD_12", "BAD_14", "BAD_17", "BAD_19"].indexOf(k) !== -1) {
        catBadge = '<span class="text-[9px] font-mono px-2 py-0.5 rounded border text-emerald-400 border-emerald-800 bg-emerald-950/60">レン編（自由）</span>';
      } else if (["BAD_04", "BAD_10", "BAD_15", "BAD_18"].indexOf(k) !== -1) {
        catBadge = '<span class="text-[9px] font-mono px-2 py-0.5 rounded border text-sky-400 border-sky-800 bg-sky-950/60">エレナ編（平等）</span>';
      } else if (["BAD_01", "BAD_03", "BAD_13", "BAD_16"].indexOf(k) !== -1) {
        catBadge = '<span class="text-[9px] font-mono px-2 py-0.5 rounded border text-amber-400 border-amber-800 bg-amber-950/60">ダニエル編（社会）</span>';
      } else {
        catBadge = '<span class="text-[9px] font-mono px-2 py-0.5 rounded border text-purple-400 border-purple-800 bg-purple-950/60">クライマックス</span>';
      }

      if (isUnlocked) {
        card.innerHTML = '<div>' +
          '<div class="flex items-center justify-between gap-1 mb-1.5">' +
            catBadge +
            '<span class="text-[10px] text-rose-400 font-mono font-bold">💀 解明済</span>' +
          '</div>' +
          '<h4 class="text-xs sm:text-sm font-black text-rose-300 font-hud line-clamp-1">' + n.title + '</h4>' +
          '<p class="text-[11px] text-neutral-300 mt-2 line-clamp-3 leading-relaxed">' + (n.desc || "") + '</p>' +
          '<div class="text-[10px] text-amber-300 font-mono mt-2 bg-neutral-950/80 p-2 rounded border border-amber-900/40 line-clamp-2">💡 ' + (n.hint || "") + '</div>' +
          '</div>' +

  function openChart() {
    AudioEngine.play('tap');
    renderChartModal();
    var modal = document.getElementById("modalTimelineChart");

  }

  function closeChart() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalTimelineChart");
    if (modal) modal.classList.add("hidden");
  }

  function renderChartModal() {
    var state = TimelineState.getState();
    var keys = ["A", "B", "C"];

    keys.forEach(function(k) {
      var col = document.getElementById("columnNodes" + k);
      if (!col) return;
      col.innerHTML = "";

      var charNodes = Object.keys(MASTER_DB.nodes).filter(function(nid) {
        return MASTER_DB.nodes[nid].char === k && !MASTER_DB.nodes[nid].isKeepOut;
      }).sort();

      charNodes.forEach(function(nid) {
        var n = MASTER_DB.nodes[nid];
        var isVisited = state.visitedNodes.indexOf(nid) !== -1;
        var isCurrent = (state.currentNodeKey === nid);

        var item = document.createElement("div");
        item.className = "p-2.5 rounded-xl border text-xs transition-all flex justify-between items-center " +
          (isCurrent ? "bg-amber-950/60 border-amber-500 text-amber-200 font-black shadow-lg" :
           isVisited ? "bg-neutral-900 border-neutral-750 text-neutral-200 hover:border-neutral-500 cursor-pointer" :
           "bg-neutral-950/40 border-neutral-850 text-neutral-600 cursor-not-allowed");

        var titleStr = isVisited ? n.title : "？？？？？";
        var timeStr = n.time || "--:--";

        item.innerHTML = '<div>'
          + '<div class="text-[10px] opacity-70 font-mono">' + timeStr + '</div>'
          + '<div class="font-bold truncate max-w-[130px] sm:max-w-[150px]">' + titleStr + '</div>'
          + '</div>'
          + (isCurrent ? '<span class="text-[10px] text-amber-400 font-mono shrink-0">★ 現在地</span>' :
             isVisited ? '<span class="text-[10px] text-emerald-400 font-mono shrink-0">到達済</span>' :
             '<span class="text-[10px] text-neutral-600 font-mono shrink-0">未通過</span>');

        if (isVisited && !isCurrent) {
          item.onclick = function() {
            AudioEngine.play('jump');
            closeChart();
            GameEngine.launchNode(nid);
          };
        }
        col.appendChild(item);
      });
    });

    var count = Object.keys(state.unlockedEndings).length;
    var countEl = document.getElementById("chartProgressText");
    if (countEl) countEl.textContent = count + " / 21 結末解明";

    if (btnCert) {
      btnCert.classList.toggle("hidden", count === 0);

// 憲法マスター検定クイズコントローラー
var QuizController = (function() {
  var quizQuestions = [];
  var currentIndex = 0;
  var isAnswering = false;

  function init() {
    var btnClose = document.getElementById("btnCloseQuiz");
    if (btnClose) {
      btnClose.onclick = function() {
        AudioEngine.play('tap');
        closeQuiz();
      };
    }
    var btnStart = document.getElementById("btnStartTipsQuiz");
    if (btnStart) {
      btnStart.onclick = function() {
        startQuiz();
      };
    }
  }

  function getQuestions() {
    if (typeof window !== "undefined" && window.TIPS_QUIZ_QUESTIONS && window.TIPS_QUIZ_QUESTIONS.length > 0) {
      return window.TIPS_QUIZ_QUESTIONS;
    }
    if (typeof TIPS_QUIZ_QUESTIONS !== "undefined" && TIPS_QUIZ_QUESTIONS.length > 0) {
      return TIPS_QUIZ_QUESTIONS;
    }
    return [];
  }

  function startQuiz() {
    AudioEngine.play('chime');
    quizQuestions = getQuestions();
    currentIndex = 0;
    isAnswering = false;

    var totalCountEl = document.getElementById("quizTotalCount");
    if (totalCountEl) totalCountEl.textContent = quizQuestions.length;

    var modal = document.getElementById("modalQuiz");
    if (modal) modal.classList.remove("hidden");
    renderCurrentQuestion();
  }

  function closeQuiz() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalQuiz");
    if (modal) modal.classList.add("hidden");
  }

  function renderCurrentQuestion() {
    var q = quizQuestions[currentIndex];
    if (!q) return;

    isAnswering = false;
    var idxEl = document.getElementById("quizCurrentIndex");
    if (idxEl) idxEl.textContent = currentIndex + 1;

    var catEl = document.getElementById("quizCategoryBadge");
    if (catEl) catEl.textContent = q.category;

    var textEl = document.getElementById("quizQuestionText");
    if (textEl) textEl.textContent = q.question;

    var feedbackBox = document.getElementById("quizFeedbackBox");
    if (feedbackBox) {
      feedbackBox.classList.add("hidden");
      feedbackBox.innerHTML = "";
    }

    var choicesCont = document.getElementById("quizChoicesContainer");
    if (!choicesCont) return;
    choicesCont.innerHTML = "";

    q.choices.forEach(function(choiceText, idx) {
      var btn = document.createElement("button");
      btn.className = "w-full p-3.5 sm:p-4 rounded-xl border border-neutral-700 bg-neutral-800/80 hover:bg-neutral-700/90 text-left text-xs sm:text-sm font-hud text-neutral-200 transition-all flex items-center justify-between gap-2 cursor-pointer shadow-md";
      btn.innerHTML = '<span class="flex items-center gap-2.5"><span>' + ['①', '②', '③'][idx] + '</span><span>' + choiceText + '</span></span>' +
                       '<span class="text-neutral-500 text-xs shrink-0">選択 ▶</span>';

      btn.onclick = function() {
        if (isAnswering) return;
        isAnswering = true;
        handleAnswer(idx);
      };

      choicesCont.appendChild(btn);
    });
  }

  function handleAnswer(selectedIdx) {
    var q = quizQuestions[currentIndex];
    var isCorrect = (selectedIdx === q.correctIndex);
    var feedbackBox = document.getElementById("quizFeedbackBox");
    if (!feedbackBox) return;

    feedbackBox.classList.remove("hidden");

    if (isCorrect) {
      AudioEngine.play('chime');
      feedbackBox.className = "p-4 rounded-xl border border-emerald-500/70 bg-emerald-950/40 text-xs font-hud space-y-2 text-emerald-200 shadow-lg";
      feedbackBox.innerHTML = '<div>' +
        '<div class="font-black text-emerald-400 text-sm flex items-center gap-1.5"><span>⭕</span><span>正 解 ！</span></div>' +
        '<p class="mt-1 text-neutral-300 leading-relaxed font-sans-jp">' + q.explanation + '</p>' +
        '</div>' +
        '<div class="pt-2 text-right">' +
        '<button id="btnQuizNextAction" class="px-4 py-2 bg-gradient-to-r from-emerald-500 to-emerald-400 hover:from-emerald-400 text-neutral-950 font-black text-xs rounded-lg shadow cursor-pointer font-hud transition-transform active:scale-95">' +
        (currentIndex + 1 < quizQuestions.length ? '次の問題へ進む ▶' : '🏆 全問合格！ 修了証書を受け取る ▶') +
        '</button>' +
        '</div>';

      var nextBtn = document.getElementById("btnQuizNextAction");
      if (nextBtn) {
        nextBtn.onclick = function() {
          AudioEngine.play('tap');
          if (currentIndex + 1 < quizQuestions.length) {
            currentIndex++;
            renderCurrentQuestion();
          } else {
            // 全問合格処理
            closeQuiz();
            TimelineState.unlockTrophy('quizMaster');
            CertRenderer.openModal('quizMaster');
          }
        };
      }
    } else {
      AudioEngine.play('bad');
      feedbackBox.className = "p-4 rounded-xl border border-rose-500/70 bg-rose-950/40 text-xs font-hud space-y-2 text-rose-200 shadow-lg";
      feedbackBox.innerHTML = '<div>' +
        '<div class="font-black text-rose-400 text-sm flex items-center gap-1.5"><span>❌</span><span>不 正 解 ……</span></div>' +
        '<p class="mt-1 text-neutral-300 leading-relaxed font-sans-jp">もう一度条文と判例の解説を振り返り、再挑戦してください。</p>' +
        '</div>' +
        '<div class="pt-2 text-right">' +
        '<button id="btnQuizRetryAction" class="px-4 py-2 bg-rose-800 hover:bg-rose-700 text-white font-bold text-xs rounded-lg shadow cursor-pointer font-hud transition-transform active:scale-95">もう一度解き直す 🔄</button>' +
        '</div>';

      var retryBtn = document.getElementById("btnQuizRetryAction");
      if (retryBtn) {
        retryBtn.onclick = function() {
          AudioEngine.play('tap');
          renderCurrentQuestion();
        };
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  return {
    startQuiz: startQuiz,
    closeQuiz: closeQuiz
  };
})();

  var currentKey = "normalClear";

  function openModal(trophyKey) {
    if (typeof trophyKey === "boolean") {

    AudioEngine.play('chime');
    var modal = document.getElementById("modalCertificate");
    if (modal) modal.classList.remove("hidden");

    var gradeBadge = document.getElementById("certGradeBadge");
    var mainTitle = document.getElementById("certMainTitle");
    if (gradeBadge) gradeBadge.textContent = spec.badgeText;
    if (mainTitle) mainTitle.textContent = spec.mainTitle;

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function() {
        drawCertificate(currentKey);
      });
    } else {
      drawCertificate(currentKey);
    }
  }

  function closeModal() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalCertificate");
    if (modal) modal.classList.add("hidden");

  function drawCertificate(trophyKey) {
    var spec = DIPLOMA_SPECS[trophyKey] || DIPLOMA_SPECS.normalClear;
    var canvas = document.getElementById("canvasCert");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var state = TimelineState.getState();

    var w = 1200;
    var h = 840;
    canvas.width = w;
    canvas.height = h;

    // 背景グラデーション
    var bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, spec.bgGradient[0]);
    bgGrad.addColorStop(0.5, spec.bgGradient[1]);
    bgGrad.addColorStop(1, spec.bgGradient[2]);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // 金枠外枠（太さ 6px）
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 6;
    ctx.strokeRect(30, 30, w - 60, h - 60);

    // 金枠内枠（余白10px、太さ 2px）
    ctx.strokeStyle = "rgba(234, 179, 8, 0.45)";
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, w - 80, h - 80);

    // 四隅のコーナー装飾
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 3;
    var cornerSize = 25;
    // 左上
    ctx.strokeRect(45, 45, cornerSize, cornerSize);
    // 右上
    ctx.strokeRect(w - 45 - cornerSize, 45, cornerSize, cornerSize);
    // 左下
    ctx.strokeRect(45, h - 45 - cornerSize, cornerSize, cornerSize);
    // 右下
    ctx.strokeRect(w - 45 - cornerSize, h - 45 - cornerSize, cornerSize, cornerSize);

    // メインタイトル
    ctx.fillStyle = "#fde047";
    ctx.font = "bold 44px 'Shippori Mincho', serif";
    ctx.textAlign = "center";
    ctx.fillText(spec.mainTitle, w / 2, 120);

    // 英文ディプロマ名
    ctx.fillStyle = "#94a3b8";
    ctx.font = "16px 'Zen Kaku Gothic New', sans-serif";
    ctx.letterSpacing = "2px";
    ctx.fillText("PARALLEL JAPANIA // " + spec.engTitle, w / 2, 160);

    // 授与者名
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 32px 'Zen Kaku Gothic New', sans-serif";
    ctx.fillText((state.studentName || "探究者") + " 殿", w / 2, 240);

    // 本文（4行）
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "20px 'Shippori Mincho', serif";
    spec.lines.forEach(function(line, idx) {
      ctx.fillText(line, w / 2, 320 + (idx * 40));
    });

    // 実績
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 22px 'Zen Kaku Gothic New', sans-serif";
    ctx.fillText("【達成実績】 " + spec.achievement, w / 2, 530);

    // 日付・発行者
    var today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    ctx.fillStyle = "#94a3b8";
    ctx.font = "18px 'Zen Kaku Gothic New', sans-serif";
    ctx.fillText(today, w / 2, 640);

    ctx.fillStyle = "#eab308";
    ctx.font = "bold 22px 'Shippori Mincho', serif";
    ctx.fillText("パラレル・ジャパニア憲法探究委員会", w / 2, 700);
  }

  function downloadPdf() {
    AudioEngine.play('tap');
    var canvas = document.getElementById("canvasCert");
    if (!canvas) return;

    var spec = DIPLOMA_SPECS[currentKey] || DIPLOMA_SPECS.normalClear;
    var filename = "Parallel_Japania_" + currentKey + ".pdf";

    if (window.jspdf && window.jspdf.jsPDF) {
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      var imgData = canvas.toDataURL("image/jpeg", 0.95);
      doc.addImage(imgData, 'JPEG', 0, 0, 297, 210);
      doc.save(filename);
    } else {
      var link = document.createElement('a');
      link.download = "Parallel_Japania_" + currentKey + ".png";
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  }

  function init() {
    var btnPdf = document.getElementById("btnDownloadPdf");
    if (btnPdf) btnPdf.onclick = downloadPdf;
    var btnCloseTop = document.getElementById("btnCloseCertTop");
    if (btnCloseTop) btnCloseTop.onclick = closeModal;
    var btnCloseBottom = document.getElementById("btnCloseCertBottom");

      };
    }
    var btnChartCert = document.getElementById("btnChartCertDownload");
    if (btnChartCert) {
      btnChartCert.onclick = function() {
        openModal('normalClear');
      };
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  return {
    openModal: openModal,
    closeModal: closeModal,
    downloadPdf: downloadPdf
  };
})();
